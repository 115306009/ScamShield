
name: ScamShield LLM Generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: python -m pip install google-genai

      - name: Ingest Wiki documents
        run: python ingest.py

      - name: Generate teaching slides with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python generate.py

      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scamshield-generation-results
          path: output/
          if-no-files-found: warn
          retention-days: 7
