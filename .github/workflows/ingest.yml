
name: Wiki ingest and retrieval test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "ingest.py"
      - "retrieve.py"
      - ".github/workflows/ingest.yml"

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ingest documents
        run: python ingest.py

      - name: Test retrieval
        run: python retrieve.py "如何辨識釣魚郵件？"
